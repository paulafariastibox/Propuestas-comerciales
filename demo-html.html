<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Demo HTML TIBOX</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#05152d;color:white;min-height:100vh;display:grid;place-items:center;background-image:radial-gradient(circle at 80% 20%,rgba(0,190,240,.24),transparent 28%)}
.wrap{width:min(1050px,92%);display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center;padding:50px 0}.ey{color:#ffd400;font-size:12px;font-weight:800;letter-spacing:.18em}.h{font-size:56px;line-height:1.02;margin:14px 0}.p{color:#9db1c5;line-height:1.65;font-size:16px}.btn{display:inline-block;margin-top:18px;padding:13px 18px;background:#ffd000;color:#11233e;border-radius:11px;font-weight:800;cursor:pointer}.visual{height:360px;border:1px solid rgba(255,255,255,.14);border-radius:28px;position:relative;display:grid;place-items:center;background:linear-gradient(145deg,rgba(255,255,255,.06),rgba(255,255,255,.01));overflow:hidden}.ring{position:absolute;width:210px;height:210px;border:1px solid rgba(34,200,244,.4);border-radius:50%;animation:pulse 3s infinite}.ring2{width:300px;height:300px;border-color:rgba(255,210,0,.16)}.core{font-size:25px;font-weight:900;letter-spacing:.15em}.msg{margin-top:15px;color:#69e0ff;font-weight:700}@keyframes pulse{50%{transform:scale(1.05);opacity:.65}}@media(max-width:760px){.wrap{grid-template-columns:1fr;padding:28px 0}.h{font-size:38px}.visual{height:240px}}
</style></head>
<body><main class="wrap"><section><div class="ey">PROPUESTA COMERCIAL · HTML</div><div class="h">Una propuesta web puede sentirse como una experiencia, no como un archivo.</div><div class="p">Este contenido está cargado como HTML real dentro del portal. Puede incluir animaciones, botones, videos, diagramas, navegación y llamados a la acción.</div><div class="btn" onclick="document.getElementById('msg').textContent='Interacción registrada ✓'">Probar interacción</div><div id="msg" class="msg"></div></section><div class="visual"><div class="ring"></div><div class="ring ring2"></div><div class="core">TIBOX</div></div></main></body></html>
